[workspace]
resolver = "2"
members = ["conformance", "layered", "uniform"]

# Two implementations of the same todo backend, one layered and one uniform, both of
# which must pass the same conformance suite. The difference between them should be the
# structure and nothing else — that is what gets measured.

[workspace.dependencies]
conformance = { path = "conformance" }
rusqlite = { version = "0.37", default-features = false, features = ["bundled"] }
