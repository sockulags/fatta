[package]
name = "corpus"
version = "0.1.0"
edition = "2021"
publish = false

# Measurement corpus, chosen for different code shapes rather than popularity:
#   semver      — parsing and comparisons, well documented (doc confounder at its strongest)
#   serde_json  — large shared types threaded through everything (where CF should beat LOC)
#   memchr      — algorithmic code with almost no types of its own (negative control)
#   tokio-util  — async, where the difficulty sits in lifetimes rather than types
#                 (a predicted failure, included precisely for that reason)
[dependencies]
semver = "1"
serde_json = "1"
memchr = "2"
tokio-util = { version = "0.7", features = ["full"] }

[lib]
path = "src/lib.rs"
