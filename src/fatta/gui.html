<!doctype html>
<html lang="sv">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>fatta</title>
<style>
  :root {
    --bg: #101418; --panel: #171d24; --line: #232c36; --fg: #d7e0e9;
    --dim: #7c8a99; --acc: #5fb4a2; --warn: #d9a05b; --bad: #d97066;
    font-size: 15px;
  }
  * { box-sizing: border-box; margin: 0; }
  body {
    background: var(--bg); color: var(--fg); height: 100vh; display: flex;
    flex-direction: column; overflow: hidden;
    font-family: "Cascadia Code", "JetBrains Mono", Consolas, monospace;
  }
  header {
    display: flex; align-items: baseline; gap: 1.2rem; padding: .55rem 1rem;
    border-bottom: 1px solid var(--line); background: var(--panel);
  }
  header h1 { font-size: 1rem; color: var(--acc); letter-spacing: .06em; }
  header .proj { color: var(--dim); font-size: .8rem; }
  nav { margin-left: auto; display: flex; gap: .25rem; }
  nav button {
    background: none; border: 1px solid transparent; color: var(--dim); padding: .3rem .7rem;
    font: inherit; font-size: .8rem; cursor: pointer; border-radius: 4px;
  }
  nav button.on { color: var(--fg); border-color: var(--line); background: var(--bg); }
  main { flex: 1; display: flex; min-height: 0; }
  #side {
    width: 320px; border-right: 1px solid var(--line); display: flex;
    flex-direction: column; background: var(--panel);
  }
  #search {
    margin: .6rem; padding: .45rem .6rem; background: var(--bg); border: 1px solid var(--line);
    color: var(--fg); font: inherit; font-size: .85rem; border-radius: 5px; outline: none;
  }
  #search:focus { border-color: var(--acc); }
  #symbols { overflow-y: auto; flex: 1; }
  #symbols .row { padding: .28rem .8rem; cursor: pointer; font-size: .82rem; }
  #symbols .row:hover, #symbols .row.sel { background: var(--bg); }
  #symbols .row .f { color: var(--dim); font-size: .7rem; display: block; }
  #view { flex: 1; overflow-y: auto; padding: 1rem 1.4rem; min-width: 0; }
  h2 { font-size: .95rem; margin: 1.1rem 0 .4rem; color: var(--acc); }
  h2:first-child { margin-top: 0; }
  .cost { display: flex; gap: 1.6rem; margin: .4rem 0 .2rem; }
  .cost div b { display: block; font-size: 1.25rem; }
  .cost div span { color: var(--dim); font-size: .72rem; }
  .card {
    border: 1px solid var(--line); border-radius: 6px; padding: .55rem .75rem;
    margin: .45rem 0; background: var(--panel); font-size: .82rem;
  }
  .card .at { color: var(--dim); font-size: .72rem; }
  .card .sym { color: var(--acc); cursor: pointer; }
  .card .sym:hover { text-decoration: underline; }
  pre {
    white-space: pre-wrap; word-break: break-word; font-size: .78rem; color: var(--fg);
    background: var(--bg); border-radius: 4px; padding: .4rem .55rem; margin-top: .35rem;
  }
  .assert { color: var(--warn); font-size: .76rem; margin: .18rem 0; }
  .mock { color: var(--dim); font-size: .72rem; }
  .tag { font-size: .7rem; padding: .05rem .45rem; border-radius: 8px; border: 1px solid; margin-right: .35rem; }
  .tag.ok { color: var(--acc); border-color: var(--acc); }
  .tag.warn { color: var(--warn); border-color: var(--warn); }
  .tag.bad { color: var(--bad); border-color: var(--bad); }
  .dim { color: var(--dim); }
  .empty { color: var(--dim); margin-top: 2rem; text-align: center; }
  table { border-collapse: collapse; font-size: .8rem; margin-top: .4rem; }
  td, th { padding: .25rem .7rem; border-bottom: 1px solid var(--line); text-align: left; }
  th { color: var(--dim); font-weight: normal; font-size: .72rem; }
</style>
</head>
<body>
<header>
  <h1>fatta</h1><span class="proj" id="proj"></span>
  <nav>
    <button data-tab="symbol" class="on">symboler</button>
    <button data-tab="health">testhälsa</button>
    <button data-tab="leverage">hävstång</button>
  </nav>
</header>
<main>
  <div id="side">
    <input id="search" placeholder="filtrera symboler…" autocomplete="off">
    <div id="symbols"></div>
  </div>
  <div id="view"><div class="empty">Välj en symbol till vänster.</div></div>
</main>
<script>
const view = document.getElementById("view");
const listEl = document.getElementById("symbols");
let symbols = [], selected = null;

const api = (name, args = {}) =>
  fetch("/api", {
    method: "POST",
    headers: { "Content-Type": "application/json" },
    body: JSON.stringify({ name, arguments: args }),
  }).then(r => r.json());

const esc = s => String(s ?? "").replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));

function renderList(filter = "") {
  const q = filter.toLowerCase();
  const rows = symbols.filter(s => !q || s.name.toLowerCase().includes(q) || s.file.toLowerCase().includes(q));
  listEl.innerHTML = rows.slice(0, 400).map(s =>
    `<div class="row${selected === s.name + s.file ? " sel" : ""}" data-n="${esc(s.name)}" data-f="${esc(s.file)}">
       ${esc(s.name)}<span class="f">${esc(s.file)}:${s.line}</span></div>`).join("")
    + (rows.length > 400 ? `<div class="row dim">… ${rows.length - 400} till, filtrera vidare</div>` : "");
}

listEl.addEventListener("click", e => {
  const row = e.target.closest(".row[data-n]");
  if (row) openSymbol(row.dataset.n, row.dataset.f);
});
document.getElementById("search").addEventListener("input", e => renderList(e.target.value));
document.querySelectorAll("nav button").forEach(b => b.addEventListener("click", () => {
  document.querySelectorAll("nav button").forEach(x => x.classList.toggle("on", x === b));
  ({ symbol: () => { view.innerHTML = '<div class="empty">Välj en symbol till vänster.</div>'; },
     health: showHealth, leverage: showLeverage })[b.dataset.tab]();
}));

async function openSymbol(name, file) {
  selected = name + (file || "");
  renderList(document.getElementById("search").value);
  view.innerHTML = `<div class="empty">hämtar ${esc(name)}…</div>`;
  const [know, tests] = await Promise.all([
    api("what_must_i_know", { symbol: name }),
    api("which_tests_pin", { symbol: name, file_hint: file }),
  ]);
  const one = know.ambiguous
    ? (know.matches.find(m => m.at.startsWith(file)) || know.matches[0])
    : know;
  let html = `<h2>${esc(name)} <span class="dim">${esc(one.at || "")}</span></h2>`;
  if (one.cost) {
    html += `<div class="cost">
      <div><b>${one.cost.cf}</b><span>CF totalt</span></div>
      <div><b>${one.cost.own_body}</b><span>egen kropp</span></div>
      <div><b>${one.cost.closure}</b><span>slutning</span></div>
      <div><b>${one.cost.lines}</b><span>rader</span></div></div>`;
    html += one.bounded
      ? `<span class="tag ok">avgränsad — det här är allt</span>`
      : `<span class="tag warn">ej avgränsad</span>`;
  }
  const pins = tests.tests || [];
  html += `<h2>tester som spikar beteendet (${pins.length})</h2>`;
  if (!pins.length) html += `<div class="card"><span class="tag bad">ospecificerat</span> Inget test bryts om beteendet ändras.</div>`;
  for (const t of pins) {
    html += `<div class="card"><b>${esc(t.name)}</b><div class="at">${esc(t.file)}:${t.line}</div>`;
    if (t.mocked?.length) html += `<div class="mock">mockat: ${t.mocked.map(esc).join(", ")}</div>`;
    html += (t.assertions || []).map(a => `<div class="assert">${esc(a)}</div>`).join("") + `</div>`;
  }
  html += `<h2>måste förstås (${(one.must_know || []).length})</h2>`;
  for (const d of one.must_know || []) {
    html += `<div class="card"><span class="sym" data-n="${esc(d.name)}">${esc(d.name)}</span>
      <span class="dim">${esc(d.kind)}</span><div class="at">${esc(d.at)}</div>
      <pre>${esc(d.contract)}</pre></div>`;
  }
  view.innerHTML = html;
  view.querySelectorAll(".sym").forEach(el =>
    el.addEventListener("click", () => openSymbol(el.dataset.n)));
}

async function showHealth() {
  view.innerHTML = `<div class="empty">analyserar testsviten…</div>`;
  const h = await api("test_health");
  if (h.error) { view.innerHTML = `<div class="empty">${esc(h.error)}</div>`; return; }
  let html = `<h2>fabrikationssignaler (${h.findings.length})</h2>`;
  for (const f of h.findings.slice(0, 40)) {
    html += `<div class="card"><span class="tag ${f.score >= 6 ? "bad" : "warn"}">${f.score}p</span>
      <b>${esc(f.name)}</b><div class="at">${esc(f.file)}:${f.line}</div>
      ${f.reasons.map(r => `<div class="assert">${esc(r)}</div>`).join("")}</div>`;
  }
  html += `<h2>lagade utan måländring (churn)</h2>`;
  html += h.churn.length
    ? `<table><tr><th>ensam</th><th>totalt</th><th>fil</th></tr>` +
      h.churn.map(c => `<tr><td>${c.test_only}</td><td>${c.total}</td><td>${esc(c.file)}</td></tr>`).join("") + `</table>`
    : `<div class="dim">inga.</div>`;
  view.innerHTML = html;
}

async function showLeverage() {
  view.innerHTML = `<div class="empty">räknar…</div>`;
  const l = await api("doc_leverage", { limit: 30 });
  view.innerHTML = `<h2>var ett kontrakt sparar mest läsning</h2>
    <table><tr><th>sparar (tokens)</th><th>symbol</th><th>var</th></tr>` +
    l.ranked.map(r => `<tr><td>${r.would_prune}</td><td>${esc(r.name)}</td><td class="dim">${esc(r.at)}</td></tr>`).join("") +
    `</table>`;
}

api("list_symbols").then(d => {
  symbols = d.symbols || [];
  document.getElementById("proj").textContent = `${symbols.length} symboler`;
  renderList();
});
</script>
</body>
</html>
