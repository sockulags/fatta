[project]
name = "fatta"
version = "0.1.0"
description = "Mäter förståelsefotavtryck (CF) för Rust-kod ur rustdoc-JSON"
requires-python = ">=3.11"
dependencies = []

[project.scripts]
fatta = "fatta.cli:main"

[dependency-groups]
dev = ["pytest>=8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/fatta"]
